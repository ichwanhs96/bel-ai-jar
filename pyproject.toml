[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "bel-ai-jar"
version = "0.1.0"
description = "Git hooks for understanding AI-generated code changes"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
bel-ai-jar = "bel_ai_jar.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/bel-ai-jar"
Issues = "https://github.com/yourusername/bel-ai-jar/issues"