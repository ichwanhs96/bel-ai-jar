name: Release JS

on:
  push:
    tags:
      - 'js-v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'
        registry-url: 'https://registry.npmjs.org'
    - name: Run JavaScript tests
      run: |
        cd src/javascript
        npm install
        npm test
    - name: Publish to npm
      run: |
        cp README.md src/javascript/README.md
        cd src/javascript
        npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}