name: Release Python

on:
  push:
    tags:
      - 'py-v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'
    - name: Run Python tests
      run: |
        cd src/python
        pip install -e ".[dev]"
        python -m pytest
    - name: Build package
      run: |
        cd src/python
        pip install build
        python -m build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: src/python/dist/
        skip-existing: true