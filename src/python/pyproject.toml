[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "bel-ai-jar"
version = "0.1.0"
description = "Git hooks for understanding AI-generated code changes"
authors = [{name = "Ichwan", email = "ichwanharyosembodo96@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["git", "hooks", "ai", "code-review", "developer-tools", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.scripts]
bel-ai-jar = "bel_ai_jar.cli:main"

[project.urls]
Homepage = "https://github.com/ichwanhs96/bel-ai-jar"
Repository = "https://github.com/ichwanhs96/bel-ai-jar"
Issues = "https://github.com/ichwanhs96/bel-ai-jar/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]